<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Kasir - Toko IT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .flex-container { display: flex; gap: 20px; }
        .panel { flex: 1; background: #fafafa; padding: 20px; border-radius: 6px; border: 1px solid #eef0f2; }
        label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-green { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; }
        .btn-blue { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        table, th, td { border: 1px solid #dee2e6; }
        th, td { padding: 10px; text-align: left; }
        th { background-color: #f1f3f5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Dashboard Kasir - Toko IT</h2>

        <div class="flex-container">
            <!-- Form Input Barang Dagangan -->
            <div class="panel">
                <form action="/kasir" method="POST">
                    <label>Pilih Barang Dagangan:</label>
                    <select name="produk_id" required>
                        <option value="">-- Silahkan Pilih Produk --</option>
                        {% for p in produk %}
                        <option value="{{ p.id }}">{{ p.nama_produk }} - Rp {{ p.harga }} (Stok: {{ p.stok }})</option>
                        {% endfor %}
                    </select>

                    <label>Jumlah Qty:</label>
                    <input type="number" name="jumlah" min="1" value="1" required>

                    <button type="submit" class="btn-green">+ Masukkan ke Keranjang Belanja</button>
                </form>
            </div>

            <!-- Keranjang Belanja & Form Hitung Diskon Otomatis -->
            <div class="panel">
                <h3>Keranjang Belanja</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nama Produk</th>
                            <th>Harga</th>
                            <th>Qty</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in keranjang %}
                        <tr>
                            <td>{{ item.nama_produk }}</td>
                            <td>Rp {{ item.harga }}</td>
                            <td>{{ item.qty }}</td>
                            <td>Rp {{ item.subtotal }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <form action="/simpan-transaksi" method="POST">
                    <label>Diskon Toko (%):</label>
                    <!-- Event JavaScript oninput disematkan di sini untuk kalkulasi instan -->
                    <input type="number" id="diskon_input" name="diskon" min="0" max="100" value="0" oninput="hitungDiskonOtomatis()">

                    <!-- Tempat penampilan teks Total Tagihan yang berubah otomatis -->
                    <h3 id="total_display" style="margin-top: 20px; color: #dc3545;">Total Tagihan: Rp {{ total_tagihan }}</h3>

                    <button type="submit" class="btn-blue">Bayar & Cetak Struk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC UNTUK MENGHITUNG DISKON SECARA REALTIME -->
    <script>
        // Mengambil nilai murni total tagihan dari server backend Flask
        const totalAsli = parseInt("{{ total_tagihan }}") || 0;

        function hitungDiskonOtomatis() {
            const diskonPersen = parseFloat(document.getElementById('diskon_input').value) || 0;
            
            // Logika Matematika Potongan Harga
            const nilaiPotongan = totalAsli * (diskonPersen / 100);
            const totalSetelahDiskon = Math.max(0, totalAsli - nilaiPotongan);
            
            // Mengubah teks di layar browser secara instan tanpa memuat ulang halaman
            document.getElementById('total_display').innerText = "Total Tagihan: Rp " + Math.round(totalSetelahDiskon).toLocaleString('id-ID');
        }
    </script>
</body>
</html>
