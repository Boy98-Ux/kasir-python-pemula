<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kasir - Toko IT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h2 { color: #2b6cb0; border-bottom: 2px solid #2b6cb0; padding-bottom: 10px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2c5282; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th { background-color: #f2f2f2; }
        .total-box {
            margin-top: 20px;
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            color: #e53e3e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛒 Transaksi Kasir Toko IT</h2>
        
        <div class="input-group">
            <input type="text" placeholder="Nama Barang">
            <input type="number" placeholder="Harga (Rp)">
            <input type="number" placeholder="Jumlah">
            <button onclick="alert('Barang berhasil ditambahkan ke daftar visual!')">Tambah</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Barang</th>
                    <th>Harga</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mouse Logotech</td>
                    <td>Rp 50.000</td>
                    <td>2</td>
                    <td>Rp 100.000</td>
                </tr>
            </tbody>
        </table>

        <div class="total-box">
            Total Bayar: Rp 100.000
        </div>
    </div>

</body>
</html>
